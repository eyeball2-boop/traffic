<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스마트 신호등">
<title>스마트시티 신호등 원격제어</title>
<!-- MQTT 통신 라이브러리 -->
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --line:#2a3340;
    --text:#e6edf3; --muted:#8b97a6; --accent:#3fb6ff;
    --red:#ff3b3b; --yellow:#ffc21a; --green:#22e07a;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);min-height:100vh;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:440px;margin:0 auto;padding-block:16px 32px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  .chips{display:flex;gap:6px}
  .chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
  .chip.ok{color:var(--green);border-color:rgba(34,224,122,.5)} .chip.ok::before{background:var(--green)}
  .chip.bad{color:var(--red);border-color:rgba(255,59,59,.5)} .chip.bad::before{background:var(--red)}

  .stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center}
  .housing{background:#0a0a0a;border:3px solid #2b2b2b;border-radius:26px;padding:16px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 18px #000}
  .lamp{width:84px;height:84px;border-radius:50%;background:#262626;border:4px solid #000;transition:background .12s,box-shadow .12s}
  .r.on{background:var(--red);box-shadow:0 0 36px var(--red)}
  .y.on{background:var(--yellow);box-shadow:0 0 36px var(--yellow)}
  .g.on{background:var(--green);box-shadow:0 0 36px var(--green)}
  .pole{width:16px;height:30px;background:#2b2b2b}
  .phase{text-align:center;margin-top:12px}
  #pn{font-size:21px;font-weight:700;color:var(--muted)}
  #pc{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}

  .btns{display:flex;gap:12px}
  button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .big{flex:1;font-size:19px;font-weight:700;padding:20px 0}
  #btnOn{background:#0f3a24;border-color:var(--green);color:var(--green)}
  #btnOff{background:#3a1212;border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:active:not(:disabled){transform:scale(.97)}
  .msg{font-size:13px;color:var(--muted);text-align:center;min-height:18px}

  .seq{display:flex;gap:6px;font-size:13px}
  .st{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:var(--panel2);border:2px solid transparent;color:var(--muted)}
  .st b{display:block;font-size:14px}
  .st.r b{color:var(--red)} .st.g b{color:var(--green)} .st.y b{color:var(--yellow)}
  .st.r.act{border-color:var(--red)} .st.g.act{border-color:var(--green)} .st.y.act{border-color:var(--yellow)}

  details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  summary{cursor:pointer;font-size:14px;color:var(--muted)}
  .set{display:flex;gap:8px;margin-top:12px}
  input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .set button{padding:10px 14px;font-size:14px}
  .hint{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}
  .log{margin-top:10px;background:#0a0e13;border:1px solid var(--line);border-radius:10px;height:120px;overflow:auto;padding:8px 10px;font-family:Consolas,monospace;font-size:12px;line-height:1.6}
  .log .tx{color:var(--accent)} .log .rx{color:var(--green)} .log .err{color:var(--red)} .log .sys{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚦 스마트시티 신호등</h1>
    <div class="chips">
      <span id="chipServer" class="chip">서버</span>
      <span id="chipBoard" class="chip">신호등</span>
    </div>
  </header>

  <section class="stage">
    <div class="housing">
      <div id="lr" class="lamp r"></div>
      <div id="ly" class="lamp y"></div>
      <div id="lg" class="lamp g"></div>
    </div>
    <div class="pole"></div>
    <div class="phase"><div id="pn">연결 중</div><div id="pc">–</div></div>
  </section>

  <div class="btns">
    <button id="btnOn" class="big" disabled>신호등 ON</button>
    <button id="btnOff" class="big" disabled>신호등 OFF</button>
  </div>
  <div id="msg" class="msg">인터넷 중계 서버에 연결하는 중입니다…</div>

  <div class="seq">
    <div id="sr" class="st r"><b>빨간불</b>5초</div>
    <div id="sg" class="st g"><b>초록불</b>5초</div>
    <div id="sy" class="st y"><b>노란불</b>3회 점멸</div>
  </div>

  <details>
    <summary>설정 · 통신 기록</summary>
    <label for="devId" class="hint" style="display:block">장치 ID (ESP32 코드의 DEVICE_ID와 같아야 합니다)</label>
    <div class="set">
      <input id="devId" autocomplete="off" spellcheck="false">
      <button id="btnSave">저장</button>
    </div>
    <p class="hint">공개 중계 서버를 사용하므로 장치 ID를 아는 사람은 누구나 제어할 수 있습니다. 다른 사람과 겹치지 않는 ID를 쓰세요.</p>
    <div id="log" class="log"></div>
  </details>
</div>

<script>
var DEFAULT_ID = 'sc-k7q2x9';
var BROKER = 'wss://broker.hivemq.com:8884/mqtt';
var RED_MS = 5000, GREEN_MS = 5000;

var $ = function (id) { return document.getElementById(id); };
var client = null, deviceId = DEFAULT_ID;
var serverOk = false, boardOk = false, running = false;
var countdownTimer = null, ackTimer = null, lastState = null;

function loadId() {
  var p = new URLSearchParams(location.search).get('id');
  if (p) return p.trim();
  try { var s = localStorage.getItem('trafficDeviceId'); if (s) return s; } catch (e) {}
  return DEFAULT_ID;
}
function topic(name) { return 'smartcity/' + deviceId + '/' + name; }

function log(text, cls) {
  var el = $('log'), line = document.createElement('div');
  line.className = cls || 'sys';
  line.textContent = '[' + new Date().toLocaleTimeString('ko-KR', { hour12: false }) + '] ' + text;
  el.appendChild(line);
  if (el.children.length > 200) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function chip(id, ok, okText, badText) {
  var c = $(id);
  c.className = 'chip ' + (ok === null ? '' : ok ? 'ok' : 'bad');
  c.textContent = ok ? okText : badText;
}

function refreshUi() {
  chip('chipServer', serverOk, '서버 연결', '서버 끊김');
  chip('chipBoard', serverOk ? boardOk : null, '신호등 온라인', '신호등 꺼짐');
  var ready = serverOk && boardOk;
  $('btnOn').disabled = !ready || running;
  $('btnOff').disabled = !ready || !running;
  if (!serverOk) setMsg('인터넷 중계 서버에 연결하는 중입니다…');
  else if (!boardOk) setMsg('신호등 보드가 인터넷에 연결되지 않았습니다. 보드 전원과 와이파이를 확인하세요.');
}
function setMsg(t) { $('msg').textContent = t; }

function startCountdown(ms) {
  clearInterval(countdownTimer);
  var end = Date.now() + ms;
  var tick = function () {
    var left = Math.max(0, end - Date.now());
    $('pc').textContent = (left / 1000).toFixed(1) + 's';
    if (left <= 0) clearInterval(countdownTimer);
  };
  tick();
  countdownTimer = setInterval(tick, 100);
}

function applyState(s, remain) {
  $('lr').classList.toggle('on', s === 'RED');
  $('lg').classList.toggle('on', s === 'GREEN');
  $('ly').classList.toggle('on', s === 'YELLOW_ON');
  $('sr').classList.toggle('act', s === 'RED');
  $('sg').classList.toggle('act', s === 'GREEN');
  $('sy').classList.toggle('act', s === 'YELLOW_ON' || s === 'YELLOW_OFF');

  var pn = $('pn');
  if (s === 'RED')        { pn.textContent = '빨간불 · 정지'; pn.style.color = 'var(--red)';    startCountdown(remain != null ? remain : RED_MS); }
  else if (s === 'GREEN') { pn.textContent = '초록불 · 진행'; pn.style.color = 'var(--green)';  startCountdown(remain != null ? remain : GREEN_MS); }
  else if (s === 'OFF')   { pn.textContent = '꺼짐';          pn.style.color = 'var(--muted)';  clearInterval(countdownTimer); $('pc').textContent = '–'; }
  else                    { pn.textContent = '노란불 · 점멸'; pn.style.color = 'var(--yellow)'; clearInterval(countdownTimer); $('pc').textContent = '⚠'; }

  running = s !== 'OFF';
  clearTimeout(ackTimer);
  if (serverOk && boardOk) setMsg(running ? '신호등이 작동 중입니다.' : '신호등이 꺼져 있습니다.');
  refreshUi();
}

function send(cmd) {
  if (!client || !serverOk) return;
  client.publish(topic('cmd'), cmd);
  log('→ ' + cmd, 'tx');
  if (cmd !== 'STATUS') {
    $('btnOn').disabled = true; $('btnOff').disabled = true;
    setMsg('명령을 보냈습니다. 신호등의 응답을 기다리는 중…');
    clearTimeout(ackTimer);
    ackTimer = setTimeout(function () {
      setMsg('신호등에서 응답이 없습니다. 보드의 인터넷 연결을 확인하세요.');
      refreshUi();
    }, 5000);
  }
}

function connect() {
  if (client) { try { client.end(true); } catch (e) {} }
  serverOk = false; boardOk = false; running = false; lastState = null;
  applyState('OFF'); $('pn').textContent = '연결 중';
  refreshUi();

  if (typeof mqtt === 'undefined') {
    setMsg('통신 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.');
    log('mqtt 라이브러리 로드 실패', 'err');
    return;
  }

  log('장치 ID: ' + deviceId);
  client = mqtt.connect(BROKER, {
    clientId: 'web-' + Math.random().toString(16).slice(2, 10),
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });

  client.on('connect', function () {
    serverOk = true;
    log('중계 서버에 연결되었습니다.');
    client.subscribe([topic('state'), topic('online')]);
    setTimeout(function () { send('STATUS'); }, 300);
    refreshUi();
  });
  client.on('reconnect', function () { log('서버에 다시 연결하는 중…'); });
  client.on('close', function () { if (serverOk) log('서버 연결이 끊겼습니다.', 'err'); serverOk = false; refreshUi(); });
  client.on('error', function (e) { log('오류: ' + e.message, 'err'); });

  client.on('message', function (t, payload) {
    var text = payload.toString();
    log('← ' + text, 'rx');
    if (t === topic('online')) {
      boardOk = text === 'online';
      if (!boardOk) { applyState('OFF'); $('pn').textContent = '신호등 꺼짐'; }
      else if (lastState) { applyState(lastState.state, null); send('STATUS'); }
      refreshUi();
    } else if (t === topic('state')) {
      try {
        lastState = JSON.parse(text);
        if (boardOk) applyState(lastState.state, lastState.remain);
      } catch (e) { log('알 수 없는 메시지', 'err'); }
    }
  });
}

$('btnOn').onclick = function () { send('ON'); };
$('btnOff').onclick = function () { send('OFF'); };
$('btnSave').onclick = function () {
  var v = $('devId').value.trim();
  if (!v) return;
  deviceId = v;
  try { localStorage.setItem('trafficDeviceId', v); } catch (e) {}
  log('장치 ID를 변경했습니다.');
  connect();
};

deviceId = loadId();
$('devId').value = deviceId;
connect();
</script>
</body>
</html>
