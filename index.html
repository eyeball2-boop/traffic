<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스마트 신호등">
<title>스마트시티 신호등</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c232d; --line:#262f3b;
    --text:#e6edf3; --muted:#8b97a6; --accent:#3fb6ff;
    --red:#ff3b3b; --yellow:#ffc21a; --green:#22e07a;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--text);min-height:100vh;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:420px;margin:0 auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:18px}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .status.ok{color:var(--green)} .status.ok .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
  .status.bad{color:#ff8a8a} .status.bad .dot{background:var(--red)}
  .status.wait .dot{background:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}

  .stage{display:flex;flex-direction:column;align-items:center;padding-top:6px}
  .housing{background:#0a0a0a;border:3px solid #2b2b2b;border-radius:30px;padding:18px 22px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 0 18px #000,0 10px 30px rgba(0,0,0,.35)}
  .lamp{width:92px;height:92px;border-radius:50%;background:#232323;border:4px solid #000;transition:background .12s,box-shadow .12s}
  .r.on{background:var(--red);box-shadow:0 0 40px var(--red)}
  .y.on{background:var(--yellow);box-shadow:0 0 40px var(--yellow)}
  .g.on{background:var(--green);box-shadow:0 0 40px var(--green)}
  .pole{width:16px;height:28px;background:#2b2b2b}
  .phase{text-align:center;margin-top:14px;min-height:86px}
  #pn{font-size:20px;font-weight:700;color:var(--muted)}
  #pc{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.2}

  .btns{display:flex;gap:12px}
  button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .big{flex:1;font-size:19px;font-weight:700;padding:20px 0}
  #btnOn{background:#0f3a24;border-color:var(--green);color:var(--green)}
  #btnOff{background:#3a1212;border-color:var(--red);color:var(--red)}
  button:disabled{opacity:.3;cursor:not-allowed}
  button:active:not(:disabled){transform:scale(.97)}
  .msg{font-size:13px;color:var(--muted);text-align:center;min-height:20px;line-height:1.5;margin-top:-6px}

  .seq{display:flex;gap:6px;font-size:12.5px}
  .st{flex:1;text-align:center;padding:9px 4px;border-radius:10px;background:var(--panel);border:2px solid transparent;color:var(--muted)}
  .st b{display:block;font-size:13.5px}
  .st.r b{color:var(--red)} .st.g b{color:var(--green)} .st.y b{color:var(--yellow)}
  .st.r.act{border-color:var(--red)} .st.g.act{border-color:var(--green)} .st.y.act{border-color:var(--yellow)}

  /* 컴퓨터에서만 보이는 USB 연결 줄 */
  .usbbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted)}
  .usbbar.live{border-color:rgba(34,224,122,.45);color:var(--green)}
  .usbbar button{font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:10px;border-color:var(--accent);color:var(--accent);background:transparent;white-space:nowrap}
  .usbbar.live button{border-color:var(--line);color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚦 스마트시티 신호등</h1>
    <span id="status" class="status wait"><span class="dot"></span><span id="statusText">연결 중</span></span>
  </header>

  <section class="stage">
    <div class="housing">
      <div id="lr" class="lamp r"></div>
      <div id="ly" class="lamp y"></div>
      <div id="lg" class="lamp g"></div>
    </div>
    <div class="pole"></div>
    <div class="phase"><div id="pn">연결 중</div><div id="pc">–</div></div>
  </section>

  <div class="btns">
    <button id="btnOn" class="big" disabled>신호등 ON</button>
    <button id="btnOff" class="big" disabled>신호등 OFF</button>
  </div>
  <div id="msg" class="msg"></div>

  <div class="seq">
    <div id="sr" class="st r"><b>빨간불</b>5초</div>
    <div id="sg" class="st g"><b>초록불</b>5초</div>
    <div id="sy" class="st y"><b>노란불</b>3회 점멸</div>
  </div>

  <div id="usbBar" class="usbbar" hidden>
    <span id="usbText">신호등 보드가 꽂힌 컴퓨터라면 연결하세요.</span>
    <button id="btnUsb">🔌 USB 연결</button>
  </div>
</div>

<script>
/* ===== 설정 ===== */
var DB_URL = 'https://traffice-9d12f-default-rtdb.firebaseio.com';
var DEVICE_ID = 'signal1';                 // 주소 끝에 ?id=이름 을 붙이면 다른 신호등을 제어
var RED_MS = 5000, GREEN_MS = 5000;

var $ = function (id) { return document.getElementById(id); };
var deviceId = (new URLSearchParams(location.search).get('id') || DEVICE_ID).replace(/[.#$\[\]\/]/g, '');
var db = null, root = null, timeOffset = 0;
var serverOk = false, boardOk = false, running = false;
var countdownTimer = null, ackTimer = null, lastState = null;

// USB 중계(컴퓨터)
var gateway = false, port = null, reader = null, writer = null, wakeLock = null;
var gotSerial = false, noReply = false, cmdListening = false;
var boardState = { state: 'OFF', at: Date.now() };

function log() { try { console.log.apply(console, ['[신호등]'].concat([].slice.call(arguments))); } catch (e) {} }
function setMsg(t) { $('msg').textContent = t || ''; }

/* ===== 화면 ===== */
function setStatus(cls, text) {
  $('status').className = 'status ' + cls;
  $('statusText').textContent = text;
}

function refreshUi() {
  var ready = gateway ? (boardOk && gotSerial) : (serverOk && boardOk);
  $('btnOn').disabled = !ready || running;
  $('btnOff').disabled = !ready || !running;

  if (!serverOk && !gateway) setStatus('wait', '연결 중');
  else if (gateway && !gotSerial) setStatus(noReply ? 'bad' : 'wait', noReply ? '보드 응답 없음' : '보드 확인 중');
  else if (gateway || boardOk) setStatus('ok', '신호등 연결됨');
  else setStatus('bad', '신호등 오프라인');

  var bar = $('usbBar');
  bar.classList.toggle('live', gateway && gotSerial);
  if (gateway && gotSerial) {
    $('usbText').textContent = serverOk ? '✅ 이 컴퓨터가 중계 중 · 창을 닫지 마세요' : '✅ USB 연결됨 · 인터넷 연결 중…';
    $('btnUsb').textContent = '연결 해제';
  } else if (gateway) {
    $('usbText').textContent = noReply ? '보드가 응답하지 않습니다. EN 버튼을 눌러 보세요.' : '보드 응답을 기다리는 중…';
    $('btnUsb').textContent = '연결 해제';
  } else {
    $('usbText').textContent = '신호등 보드가 꽂힌 컴퓨터라면 연결하세요.';
    $('btnUsb').textContent = '🔌 USB 연결';
  }
}

function startCountdown(ms) {
  clearInterval(countdownTimer);
  var end = Date.now() + ms;
  var tick = function () {
    var left = Math.max(0, end - Date.now());
    $('pc').textContent = (left / 1000).toFixed(1) + 's';
    if (left <= 0) clearInterval(countdownTimer);
  };
  tick();
  countdownTimer = setInterval(tick, 100);
}

function applyState(s, remain) {
  $('lr').classList.toggle('on', s === 'RED');
  $('lg').classList.toggle('on', s === 'GREEN');
  $('ly').classList.toggle('on', s === 'YELLOW_ON');
  $('sr').classList.toggle('act', s === 'RED');
  $('sg').classList.toggle('act', s === 'GREEN');
  $('sy').classList.toggle('act', s === 'YELLOW_ON' || s === 'YELLOW_OFF');

  var pn = $('pn');
  if (s === 'RED')        { pn.textContent = '빨간불 · 정지'; pn.style.color = 'var(--red)';    startCountdown(remain != null ? remain : RED_MS); }
  else if (s === 'GREEN') { pn.textContent = '초록불 · 진행'; pn.style.color = 'var(--green)';  startCountdown(remain != null ? remain : GREEN_MS); }
  else if (s === 'OFF')   { pn.textContent = '꺼짐';          pn.style.color = 'var(--muted)';  clearInterval(countdownTimer); $('pc').textContent = '–'; }
  else                    { pn.textContent = '노란불 · 점멸'; pn.style.color = 'var(--yellow)'; clearInterval(countdownTimer); $('pc').textContent = '⚠'; }

  running = s !== 'OFF';
  clearTimeout(ackTimer);
  setMsg('');
  refreshUi();
}

/* ===== ON / OFF ===== */
function command(cmd) {
  if (gateway) { serialSend(cmd); return; }          // 컴퓨터: USB로 바로 전달
  if (!root || !serverOk) return;                    // 휴대폰: Firebase를 거쳐 전달
  root.child('cmd').set({ c: cmd, t: firebase.database.ServerValue.TIMESTAMP }).catch(writeError);
  if (cmd === 'STATUS') return;
  $('btnOn').disabled = true; $('btnOff').disabled = true;
  setMsg('신호를 보내는 중…');
  clearTimeout(ackTimer);
  ackTimer = setTimeout(function () {
    refreshUi();
    setMsg('신호등에서 응답이 없습니다. 보드가 꽂힌 컴퓨터의 창을 확인하세요.');
  }, 6000);
}

function writeError(e) {
  log('Firebase 쓰기 실패', e);
  if (String(e && e.message).toLowerCase().indexOf('permission') >= 0) {
    setStatus('bad', '권한 오류');
    setMsg('Firebase 규칙에서 traffic 경로의 읽기·쓰기를 허용해야 합니다.');
  }
}

/* ===== Firebase ===== */
function startFirebase() {
  if (typeof firebase === 'undefined' || !firebase.database) {
    setStatus('bad', '연결 실패');
    setMsg('인터넷 연결을 확인한 뒤 새로고침하세요.');
    return;
  }
  firebase.initializeApp({ databaseURL: DB_URL });
  db = firebase.database();
  root = db.ref('traffic/' + deviceId);

  var firstTimer = setTimeout(function () {
    if (!serverOk) { setStatus('bad', '연결 실패'); setMsg('인터넷 연결을 확인한 뒤 새로고침하세요.'); }
  }, 10000);

  db.ref('.info/serverTimeOffset').on('value', function (s) { timeOffset = s.val() || 0; });
  db.ref('.info/connected').on('value', function (s) {
    serverOk = s.val() === true;
    if (serverOk) { clearTimeout(firstTimer); if (gateway) goOnline(); }
    refreshUi();
  });

  // 원격(휴대폰) 화면: 보드 상태 표시
  root.child('online').on('value', function (s) {
    if (gateway) return;
    var was = boardOk;
    boardOk = s.val() === true;
    if (!boardOk) { applyState('OFF'); $('pn').textContent = '신호등 오프라인'; }
    else if (!was) { if (lastState) applyState(lastState.state, remainOf(lastState)); command('STATUS'); }
    refreshUi();
  }, writeError);

  root.child('state').on('value', function (s) {
    if (gateway) return;
    lastState = s.val();
    if (boardOk && lastState) applyState(lastState.state, remainOf(lastState));
  });
}

function remainOf(st) {
  if (!st || !st.at) return null;
  return Math.max(0, (st.remain || 0) - (Date.now() + timeOffset - st.at));
}

/* ===== USB 중계 (컴퓨터) ===== */
function goOnline() {
  if (!root || !gateway) return;
  var on = root.child('online');
  on.onDisconnect().set(false);                      // 창이 닫히거나 인터넷이 끊기면 자동으로 오프라인
  on.set(true).catch(writeError);
  if (!cmdListening) {
    cmdListening = true;
    root.child('cmd').remove().then(function () { root.child('cmd').on('value', onCmd); });
  }
  publishBoardState();
}

function onCmd(s) {
  var v = s.val();
  if (!v || !gateway) return;
  root.child('cmd').remove();
  var c = String(v.c || '').toUpperCase();
  if (c === 'STATUS') publishBoardState();
  else if (c === 'ON' || c === 'OFF') serialSend(c);
}

function remainNow() {
  var el = Date.now() - boardState.at;
  if (boardState.state === 'RED')   return Math.max(0, RED_MS - el);
  if (boardState.state === 'GREEN') return Math.max(0, GREEN_MS - el);
  return 0;
}
function publishBoardState() {
  if (!root || !gateway || !serverOk) return;
  root.child('state').set({ state: boardState.state, remain: remainNow(), at: firebase.database.ServerValue.TIMESTAMP })
    .catch(writeError);
}

async function usbConnect() {
  try {
    port = await navigator.serial.requestPort();
  } catch (e) { return; }                            // 포트 선택 창을 닫은 경우
  try {
    await port.open({ baudRate: 115200 });
  } catch (e) {
    port = null;
    setMsg('USB 포트를 다른 프로그램이 쓰고 있습니다. 아두이노 IDE와 다른 탭을 닫고 다시 시도하세요.');
    return;
  }
  writer = port.writable.getWriter();
  reader = port.readable.getReader();
  gateway = true; boardOk = true; gotSerial = false; noReply = false;
  boardState = { state: 'OFF', at: Date.now() };
  applyState('OFF');
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  readLoop();
  if (serverOk) goOnline();
  setTimeout(function () { serialSend('STATUS'); }, 1200);
  setTimeout(function () { if (gateway && !gotSerial) { noReply = true; refreshUi(); } }, 4000);
}

async function readLoop() {
  var dec = new TextDecoder(), buf = '';
  try {
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true });
      var i;
      while ((i = buf.indexOf('\n')) >= 0) {
        var line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (line) onSerialLine(line);
      }
    }
  } catch (e) { log('USB 수신 오류', e); }
}

function onSerialLine(line) {
  log('USB ←', line);
  if (line.indexOf('STATE:') !== 0) return;
  if (!gotSerial) { gotSerial = true; noReply = false; }
  var s = line.slice(6);
  boardState = { state: s, at: Date.now() };
  applyState(s, remainNow());
  publishBoardState();
}

async function serialSend(cmd) {
  if (!writer) return;
  try { await writer.write(new TextEncoder().encode(cmd + '\n')); log('USB →', cmd); }
  catch (e) { log('USB 전송 오류', e); }
}

async function usbDisconnect() {
  if (!gateway) return;
  gateway = false;
  if (root) {
    root.child('cmd').off('value', onCmd);
    cmdListening = false;
    root.child('online').set(false).catch(function () {});
    root.child('online').onDisconnect().cancel();
  }
  try { if (reader) { await reader.cancel(); reader.releaseLock(); } } catch (e) {}
  try { if (writer) writer.releaseLock(); } catch (e) {}
  try { if (port) await port.close(); } catch (e) {}
  reader = writer = port = null;
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  boardOk = false; gotSerial = false;
  applyState('OFF');
}

/* ===== 버튼 / 시작 ===== */
$('btnOn').onclick = function () { command('ON'); };
$('btnOff').onclick = function () { command('OFF'); };
$('btnUsb').onclick = function () { if (gateway) usbDisconnect(); else usbConnect(); };

// USB 연결은 컴퓨터(크롬/엣지)에서만 보이게
var isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if ('serial' in navigator && !isPhone) {
  $('usbBar').hidden = false;
  navigator.serial.addEventListener('disconnect', function (e) {
    if (port && e.target === port) { usbDisconnect(); setMsg('USB 보드가 분리되었습니다.'); }
  });
  document.addEventListener('visibilitychange', async function () {
    if (gateway && document.visibilityState === 'visible' && navigator.wakeLock && (!wakeLock || wakeLock.released)) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  });
}
window.addEventListener('beforeunload', function () {
  if (gateway && root) root.child('online').set(false);
});

startFirebase();
refreshUi();
</script>
</body>
</html>
